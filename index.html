<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Bonafé Café</title>
    <meta name="description" content="A sala de café virtual do Bonafé.">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
            background: #000;
            color: #fff;
            font-family: system-ui, sans-serif;
        }

        /* Phone: the feed is the whole screen */
        cafe-feed { height: 100dvh; }
        aside { display: none; }

        /* Desktop: landing page, with the same feed in a 9:16 column */
        @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
            body {
                display: grid;
                grid-template-columns: 1fr auto 1fr;
                align-items: center;
                gap: 48px;
                padding: 0 48px;
                box-sizing: border-box;
                background: #17110c;
            }
            cafe-feed {
                --h: min(92vh, 900px);
                height: var(--h);
                width: calc(var(--h) * 9 / 16);
                border-radius: 24px;
            }
            aside { display: block; }
            aside h1 { font-size: 2.6rem; margin: 0 0 12px; }
            aside p { font-size: 1.1rem; line-height: 1.5; opacity: .85; max-width: 24ch; }
            aside.right { justify-self: start; }
            aside.left { justify-self: end; }
        }
    </style>
</head>
<body>
    <aside class="left">
        <h1>Bonafé Café</h1>
        <p>A sala de café virtual do Bonafé.</p>
    </aside>

    <cafe-feed></cafe-feed>

    <aside class="right">
        <p>Esta experiência é feita para o celular. Abra <strong>bonafe.cafe</strong> no seu telefone.</p>
    </aside>

    <script type="module">
        import './components/cafe-feed.js';

        const feed = document.querySelector('cafe-feed');
        const response = await fetch('feed.json');
        feed.state = await response.json();
    </script>
</body>
</html>
